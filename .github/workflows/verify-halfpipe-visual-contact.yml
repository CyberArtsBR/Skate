name: Verify Halfpipe Visual Contact

on:
  push:
    branches:
      - fix/halfpipe-visual-contact-authority-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Start Vite
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/halfpipe-vite.log 2>&1 &
          echo $! > /tmp/halfpipe-vite.pid
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/halfpipe-vite.log
          exit 1

      - name: Visual contact regression
        run: node checks/visual-contact.mjs

      - name: Browser smoke
        run: node checks/browser-smoke.mjs

      - name: Upload contact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halfpipe-visual-contact-evidence
          path: audit/
          if-no-files-found: ignore
