name: Materialize Hollywood Background

on:
  push:
    branches:
      - chore/hollywood-background-v1
    paths:
      - '.tmp-hollywood/**'
      - '.github/workflows/materialize-hollywood-background.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild original JPEG byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/backgrounds
          cat .tmp-hollywood/chunk_*.b64 | base64 --decode > public/images/backgrounds/halfpipe-hollywood-original.jpg
          echo "741758786796ece2f384c74a9b541500f10e7bc3566ab0f8845e00bebec1a94a  public/images/backgrounds/halfpipe-hollywood-original.jpg" | sha256sum -c -
          test "$(stat -c%s public/images/backgrounds/halfpipe-hollywood-original.jpg)" -eq 542186

      - name: Commit original binary asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/backgrounds/halfpipe-hollywood-original.jpg
          if git diff --cached --quiet; then
            echo "Binary asset already materialized."
            exit 0
          fi
          git commit -m "assets: add original Hollywood halfpipe background"
          git push origin HEAD:chore/hollywood-background-v1
