name: Phase 4 Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static and release contracts
        run: npm run check:static
      - name: Passive physics
        run: npm run check:physics
      - name: Contact clearance
        run: npm run check:contact
      - name: Session flow
        run: npm run check:session
      - name: Controller input
        run: npm run check:controller
      - name: Camera framing
        run: npm run check:camera
      - name: Trick presentation
        run: npm run check:tricks
      - name: Gameplay core
        run: npm run check:gameplay
      - name: V9 regressions
        run: npm run check:v9
      - name: V15 pump energy regression
        run: npm run check:v15
      - name: Rig compatibility
        run: npm run check:rigs
      - name: Character tricks
        run: npm run check:character
      - name: UI flow
        run: npm run check:ui
      - name: Integration
        run: npm run check:integration
      - name: Production build
        run: npm run build

  browser:
    name: Browser and visual contact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/halfpipe-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/halfpipe-preview.log
          exit 1
      - name: Run production browser smoke
        env:
          HALFPIPE_PREVIEW_URL: http://127.0.0.1:4173
        run: npm run check:browser:release
      - name: Run deep browser smoke
        if: always()
        env:
          HALFPIPE_PREVIEW_URL: http://127.0.0.1:4173
        run: npm run check:browser
      - name: Run visual contact regression
        if: always()
        env:
          HALFPIPE_PREVIEW_URL: http://127.0.0.1:4173
        run: npm run check:visual-contact

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:security
