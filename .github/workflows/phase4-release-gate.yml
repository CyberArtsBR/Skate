name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax
        run: npm run check:syntax
      - name: Current release contracts
        if: always()
        run: npm run check:contracts

  simulation:
    name: Simulation and gameplay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Current gameplay invariants
        run: npm run check:gameplay:current
      - name: Contact clearance
        if: always()
        run: npm run check:contact
      - name: Session flow
        if: always()
        run: npm run check:session
      - name: Controller input
        if: always()
        run: npm run check:controller
      - name: Camera framing
        if: always()
        run: npm run check:camera
      - name: V15 pump energy regression
        if: always()
        run: npm run check:v15

  presentation:
    name: Presentation and integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coping glow contract
        run: npm run check:coping-glow
      - name: Graffiti ramp contract
        if: always()
        run: npm run check:graffiti-ramp
      - name: Aerial tuck
        if: always()
        run: npm run check:aerial-tuck
      - name: Rig compatibility
        if: always()
        run: npm run check:rigs
      - name: Character tricks
        if: always()
        run: npm run check:character
      - name: HUD palettes
        if: always()
        run: npm run check:hud-palettes
      - name: Map lighting
        if: always()
        run: npm run check:map-lighting

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  browser:
    name: Browser release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/halfpipe-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/halfpipe-preview.log
          exit 1
      - name: Current production browser smoke
        env:
          HALFPIPE_PREVIEW_URL: http://127.0.0.1:4173
        run: npm run check:browser
      - name: Visual contact regression
        if: always()
        env:
          HALFPIPE_PREVIEW_URL: http://127.0.0.1:4173
        run: npm run check:visual-contact
      - name: Preview log on failure
        if: failure()
        run: cat /tmp/halfpipe-preview.log || true

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:security
