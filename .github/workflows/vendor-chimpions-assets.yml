name: Vendor Chimpion Assets

on:
  push:
    branches:
      - assets/halfpipe-local-chimpions-v11

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/halfpipe-local-chimpions-v11
          fetch-depth: 0

      - name: Vendor source-identical Chimpion assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/models/characters public/images/characters

          download_glb() {
            local url="$1"
            local target="$2"
            local expected_sha="$3"
            local tmp
            tmp="$(mktemp)"

            echo "Downloading GLB: $target"
            curl --fail --location --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 240 \
              "$url" -o "$tmp"

            test "$(head -c 4 "$tmp")" = "glTF"
            local actual_sha
            actual_sha="$(git hash-object "$tmp")"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "GLB SHA mismatch for $target: expected $expected_sha got $actual_sha" >&2
              exit 1
            fi

            mv "$tmp" "$target"
          }

          download_gif() {
            local url="$1"
            local target="$2"
            local tmp
            tmp="$(mktemp)"

            echo "Downloading GIF: $target"
            curl --fail --location --retry 4 --retry-delay 2 \
              --connect-timeout 20 --max-time 180 \
              "$url" -o "$tmp"

            local magic
            magic="$(head -c 6 "$tmp")"
            if [ "$magic" != "GIF87a" ] && [ "$magic" != "GIF89a" ]; then
              echo "Thumbnail is not an animated GIF source: $target" >&2
              echo "Detected MIME: $(file -b --mime-type "$tmp" || true)" >&2
              echo "First bytes: $(xxd -p -l 16 "$tmp" || true)" >&2
              exit 1
            fi

            if [ "$(stat -c%s "$tmp")" -lt 1024 ]; then
              echo "Thumbnail is unexpectedly small: $target" >&2
              exit 1
            fi

            mv "$tmp" "$target"
          }

          BASE_GLBS="https://chimp-jump.onrender.com/model/characters"

          download_glb "$BASE_GLBS/The%20Archon.glb" "public/models/characters/The Archon.glb" "56acfcb00a5ae6a7c543f15face89dc5a05973b0"
          download_glb "$BASE_GLBS/The%20Heretic.glb" "public/models/characters/The Heretic.glb" "d6cf952128b625e52a6e109de80d0c7493020806"
          download_glb "$BASE_GLBS/The%20Commodore.glb" "public/models/characters/The Commodore.glb" "eb2f44b25d88420cc5196fe012027278abd2d9b0"
          download_glb "$BASE_GLBS/The%20Pioneer.glb" "public/models/characters/The Pioneer.glb" "726bc406f0f7d965d5756483219d9138842c29c7"
          download_glb "$BASE_GLBS/The%20Punk.glb" "public/models/characters/The Punk.glb" "129200342b76c18473a193a745d70a3c3a134c7d"
          download_glb "$BASE_GLBS/The%20Street%20Fighter.glb" "public/models/characters/The Street Fighter.glb" "cf4ff7da5140239fd8278b54493d0ffb920ac374"
          download_glb "$BASE_GLBS/The%20Bosun.glb" "public/models/characters/The Bosun.glb" "538ae4ab357a4f23ce20b600c0f43c5f7eb40e9d"
          download_glb "$BASE_GLBS/The%20Adolescent.glb" "public/models/characters/The Adolescent.glb" "45af19ba7ed7a3265e3b7079e3df1992f95025ef"
          download_glb "$BASE_GLBS/The%20Angsty.glb" "public/models/characters/The Angsty.glb" "fdfc5ba7fe6b1bcb9432120284f34097916060ae"
          download_glb "$BASE_GLBS/The%20Apologetic.glb" "public/models/characters/The Apologetic.glb" "2f6d5b8b148c7529b6d6370c54cc9cfdc8311d11"

          download_gif "https://arweave.net/5jsHyN5yHpmkT-usm3w--BwC9fZKqFeZ2QGY9Nj4xrE" "public/images/characters/archon.gif"
          download_gif "https://arweave.net/-o3xO43MWMUll7FBIrJ2j6rK8Nq4K4YPENdzecPOCdE" "public/images/characters/heretic.gif"
          download_gif "https://arweave.net/Lbpd42IUkDzfy2uarQjP2JDeAn4qzpFfO6GUfAeW2bc" "public/images/characters/commodore.gif"
          download_gif "https://arweave.net/VA0_0h2MzW6ilZsE_iAW0Ppk70fm0k_PN205MF3vD6s" "public/images/characters/pioneer.gif"
          download_gif "https://arweave.net/Of2DMtt0q9hpAyXVzK-M24rvi_CymCcFi2RLrVnu-sc" "public/images/characters/punk.gif"
          download_gif "https://arweave.net/yRhvGxxkyDkwQwQmxnORL3vacyGI3ERvMugkLkDvjK8" "public/images/characters/street-fighter.gif"
          download_gif "https://arweave.net/Xct_-Q1nQaFfhHKQfUhyMr2c1KcoCaCTJQpcr9mqdbs" "public/images/characters/bosun.gif"
          download_gif "https://arweave.net/HGBlJxXb_X0yTwtHQyKPKPvFbJh9r3Ch4-XbZyNoLaI" "public/images/characters/adolescent.gif"
          download_gif "https://arweave.net/tInLoI8PpzOmaE6Ju9H1pWaVCUNpFkYk1pXc8Ha8ASM" "public/images/characters/angsty.gif"
          download_gif "https://arweave.net/GKX1TmFqdV9USvPPP96ugeP7LDajDsg3Fc_LWwahXDs" "public/images/characters/apologetic.gif"

          {
            echo "# Vendored Chimpion asset checksums"
            echo "# Generated from the exact files committed below."
            sha256sum public/models/characters/*.glb public/images/characters/*.gif
          } > public/images/characters/SHA256SUMS.txt

      - name: Commit vendored binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/characters public/images/characters
          if git diff --cached --quiet; then
            echo "Assets already vendored."
            exit 0
          fi
          git commit -m "assets: vendor 10 Chimpion GLBs and animated thumbnails"
          git push origin HEAD:assets/halfpipe-local-chimpions-v11
